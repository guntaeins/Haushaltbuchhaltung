<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">

<meta name="mobile-web-app-capable" content="yes">

<title>Haushaltbuch</title>
<style>
:root{--bg:#f5f5f3;--card:#fff;--tx:#1d1d1f;--mut:#8a8a8e;--line:#e8e8e5;--acc:#1f4e5f;--pos:#2e7d4f;--neg:#b3392f}
*{box-sizing:border-box;margin:0;padding:0}
body{font:16px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:calc(76px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}
body.dragging{user-select:none;-webkit-user-select:none;cursor:grabbing}
header{position:sticky;top:0;background:rgba(245,245,243,.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);padding:calc(12px + env(safe-area-inset-top)) 18px 8px;display:flex;align-items:center;gap:10px;z-index:5}
header h1{font-size:26px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{font-size:17px;color:var(--acc);background:none;border:0;cursor:pointer}
#sy{font-size:12px;color:var(--mut);white-space:nowrap}
main{padding:0 14px 30px;max-width:720px;margin:0 auto}
.card{background:var(--card);border-radius:14px;margin:8px 0;overflow:hidden}
.row{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);gap:12px;background:var(--card)}
.row:last-child{border-bottom:0}
#L-ba>.row:last-child,#L-bp>.row:last-child{border-bottom:1px solid var(--line)}
.row .l{flex:1;min-width:0}
.row.drag{position:relative;z-index:3;box-shadow:0 4px 16px rgba(0,0,0,.18);background:#fbfbfa}
.grip{flex:none;touch-action:none;cursor:grab;color:#c4c4c0;padding:8px 4px 8px 0;margin:-8px -4px -8px -6px;display:flex;align-items:center}
.grip svg{width:12px;height:18px;fill:currentColor}
.grip:hover{color:var(--mut)}
.t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:13px;color:var(--mut)}
.note{font-size:13px;color:#6c6f7f;margin-top:2px;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.amt{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.sec{font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;margin:20px 4px 2px;display:flex;justify-content:space-between;align-items:center}
.sec button{font-size:15px;color:var(--acc);background:none;border:0;text-transform:none;letter-spacing:0;cursor:pointer}
.tap{cursor:pointer}.tap:active{background:#f0f0ee}
.total{font-weight:700}
.empty{color:var(--mut);text-align:center;padding:24px 16px;font-size:15px}
.hero{padding:16px}
.hero .big{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
.warn{background:#fff4e0;color:#8a5a00;border-radius:12px;padding:10px 14px;font-size:14px;margin:8px 0}
nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;background:none;border:0;padding:8px 0 6px;font-size:11px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav button.on{color:var(--acc)}
nav svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.fab{position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:var(--acc);color:#fff;border:0;font-size:30px;line-height:1;box-shadow:0 4px 14px rgba(0,0,0,.22);z-index:6;cursor:pointer}
.btn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:12px 18px;font-size:16px;font-weight:600;cursor:pointer}
.btn:disabled{opacity:.5}
.btn.s2{background:#e6e6e3;color:var(--tx)}
.btn.del{background:none;color:var(--neg);margin-left:auto}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 4px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;border-radius:16px 16px 0 0;max-height:94vh;overflow:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
@media(min-width:600px){.ov{align-items:center}.sheet{border-radius:16px}}
.sheet h2{font-size:20px;margin-bottom:8px}
.sheet p{font-size:15px;margin:6px 0}
.sheet ol{font-size:14px;margin:6px 0 0 20px;color:#444}
.sheet a{color:var(--acc)}
label{display:block;font-size:13px;color:var(--mut);margin:12px 2px 4px}
input,select,textarea{width:100%;font-size:17px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--tx);font-family:inherit}
textarea{resize:vertical;min-height:70px;line-height:1.35}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:-1px}
.seg{display:flex;background:#e6e6e3;border-radius:10px;padding:3px;gap:3px;margin-top:10px}
.seg button{flex:1;border:0;background:none;padding:8px 4px;border-radius:8px;font-size:15px;color:var(--tx);cursor:pointer}
.seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:600}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.err{color:var(--neg);font-size:14px;margin-top:10px;min-height:1em}
.hint{font-size:13px;color:var(--mut);margin-top:6px}
.kv{display:flex;justify-content:space-between;padding:7px 2px;border-bottom:1px solid var(--line);font-size:15px}
.kv b{font-variant-numeric:tabular-nums}
.pie{display:flex;gap:18px;align-items:center;padding:16px;flex-wrap:wrap}
.pie svg{width:150px;height:150px;flex:none}
.leg{flex:1;min-width:170px;font-size:14px}
.leg div{display:flex;align-items:center;gap:8px;padding:2px 0}
.leg span.n{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.leg span.v{color:var(--mut);font-variant-numeric:tabular-nums}
.dot{width:10px;height:10px;border-radius:3px;flex:none}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);background:#1d1d1f;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;max-width:90vw}
#lock{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:30px}
#lock h2{font-size:24px}
#lock input{max-width:220px;text-align:center;font-size:28px;letter-spacing:.4em}
#lock button{background:none;border:0;color:var(--acc);font-size:15px;margin-top:20px;cursor:pointer}
</style>

 <button data-v="mehr"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg>Einstellungen</button>

<script>
/* ===== Grundlagen ===== */
const CUR=['CHF','USD','JPY','BTC','AU'];
const CURNAME={CHF:'Schweizer Franken',USD:'US-Dollar',JPY:'Japanischer Yen',BTC:'Bitcoin',AU:'Gold (Unzen)'};
const GRPNAME={CHF:'CHF',USD:'USD',JPY:'JPY',BTC:'Bitcoin (BTC)',AU:'Gold (AU)'};
const DEC={CHF:2,USD:2,JPY:0,BTC:8,AU:3};
const RHY={12:'monatlich',4:'vierteljährlich',2:'halbjährlich',1:'jährlich'};
const SIDE={buy:'Kauf',sell:'Verkauf',in:'Bestand'};
const COL=['#1f4e5f','#c98b2b','#5b8c5a','#8e5572','#3d7ea6','#d1603d','#6c6f7f','#a4a65a','#4f6d7a','#b07d62','#7a9e9f'];
const GRIP='<span class="grip" title="Ziehen zum Verschieben"><svg viewBox="0 0 12 18"><circle cx="3" cy="3" r="1.6"/><circle cx="9" cy="3" r="1.6"/><circle cx="3" cy="9" r="1.6"/><circle cx="9" cy="9" r="1.6"/><circle cx="3" cy="15" r="1.6"/><circle cx="9" cy="15" r="1.6"/></svg></span>';
const KEY='haushaltbuch-v1',RK='haushaltbuch-kurse',SK='haushaltbuch-sync',PK='haushaltbuch-pin',FN='haushaltbuch.enc.json';
const blank=()=>({accounts:[],depots:[],budgets:[],tx:[],prices:{},divs:{},bilOrder:[]});
const lsGet=k=>{try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;}};
let Q=lsGet(RK)||{q:{},ts:null};               // Kurse: USD/JPY in CHF, BTC/AU in USD
let D=load();
function load(){
 const d=lsGet(KEY);if(!d||!Array.isArray(d.accounts))return blank();
 if(d.rates){ // Migration aus Version 1
  const r=d.rates;if(!Q.ts&&r.USD){Q={q:{USD:r.USD,JPY:r.JPY,BTC:r.BTC?r.BTC/r.USD:undefined,AU:r.AU?r.AU/r.USD:undefined},ts:d.ratesTs};saveQ();}
  delete d.rates;delete d.ratesTs;}
 return Object.assign(blank(),d);}
function saveQ(){localStorage.setItem(RK,JSON.stringify(Q));}
function save(){localStorage.setItem(KEY,JSON.stringify(D));if(S.gistId){S.dirty=true;rev++;saveS();schedulePush();}}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmtN(n,d=2){if(!isFinite(n)||Math.abs(n)<0.5*Math.pow(10,-d))n=0;const neg=n<0;let[i,f]=Math.abs(n).toFixed(d).split('.');i=i.replace(/\B(?=(\d{3})+(?!\d))/g,"'");return(neg?'-':'')+i+(f?'.'+f:'');}
const fmt=(n,c)=>fmtN(n,DEC[c]??2)+' '+c;
const fCHF=n=>fmtN(n,2);
const fQty=n=>fmtN(n,6).replace(/\.?0+$/,'');
const fPx=(n,c)=>fmtN(n,c==='JPY'?0:(Math.abs(n)<1&&n!==0?4:2));
const fRate=r=>fmtN(r,3).replace(/0+$/,'').replace(/\.$/,'')+'%';
function num(s){if(typeof s==='number')return s;s=String(s??'').replace(/['’\s]/g,'').replace(',','.');const v=parseFloat(s);return isFinite(v)?v:NaN;}
const round=(v,c)=>{const f=Math.pow(10,DEC[c]??2);return Math.round(v*f)/f;};
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const dch=s=>s?s.split('-').reverse().join('.'):'';
const dts=ts=>ts?new Date(ts).toLocaleString('de-CH',{dateStyle:'short',timeStyle:'short'}):'noch nie';
const USDQ=c=>c==='BTC'||c==='AU';
function rate(c){const q=Q.q||{};if(c==='CHF')return 1;if(c==='USD'||c==='JPY')return q[c]||0;return(q[c]||0)*(q.USD||0);}
const chf=(a,c)=>a*rate(c);
const usd=(a,c)=>a*((Q.q||{})[c]||0);
const usdLine=(a,c)=>USDQ(c)&&Q.q[c]?'≈ USD '+fmtN(usd(a,c),2):'';
const acc=id=>D.accounts.find(a=>a.id===id);
const dep=id=>D.depots.find(a=>a.id===id);
const bud=id=>D.budgets.find(a=>a.id===id);
const byDateDesc=(a,b)=>(b.date||'').localeCompare(a.date||'')||(b.ts||0)-(a.ts||0);
const curSort=(a,b)=>CUR.indexOf(a)-CUR.indexOf(b);
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2800);}

/* ===== Berechnungen ===== */
function effect(t,id){
 if(t.type==='b'&&t.acc===id)return t.amt;
 if(t.type==='t'){let s=0;if(t.from===id)s-=t.amtFrom;if(t.to===id)s+=t.amtTo;return s;}
 if(t.type==='w'&&t.acc===id&&t.side!=='in')return t.side==='buy'?-t.amtAcc:t.amtAcc;
 return 0;}
const txOf=id=>D.tx.filter(t=>(t.type==='b'&&t.acc===id)||(t.type==='t'&&(t.from===id||t.to===id))||(t.type==='w'&&t.side!=='in'&&t.acc===id));
function bal(id){const a=acc(id);let s=a?(a.open||0):0;for(const t of D.tx)s+=effect(t,id);return s;}
function positions(depId,exclude){
 const m={};
 D.tx.filter(t=>t.type==='w'&&t.dep===depId&&t!==exclude).sort((a,b)=>-byDateDesc(a,b)).forEach(t=>{
  const p=m[t.sec]||(m[t.sec]={sec:t.sec,cur:t.cur,qty:0,cost:0,last:null,lastDate:'',fb:t.price});
  if(t.side==='sell'){const avg=p.qty?p.cost/p.qty:0;p.cost-=avg*t.qty;p.qty-=t.qty;}
  else{p.qty+=t.qty;p.cost+=t.qty*t.price;}
  if(t.side!=='in'){p.last=t.price;p.lastDate=t.date;}
  p.cur=t.cur;});
 return Object.values(m).filter(p=>p.qty>1e-10).map(p=>{
  const pr=D.prices[depId+'|'+p.sec];
  if(pr&&(p.last==null||pr.date>=p.lastDate)){p.price=pr.price;p.pdate=pr.date;}
  else if(p.last!=null){p.price=p.last;p.pdate=p.lastDate;}else{p.price=p.fb;p.pdate='';}
  p.div=(D.divs||{})[depId+'|'+p.sec]||0;p.divYear=p.qty*p.div;p.divYield=p.price?p.div/p.price*100:0;
  p.avg=p.cost/p.qty;p.value=p.qty*p.price;p.gain=p.value-p.cost;p.gainPct=p.cost?p.gain/p.cost*100:0;p.chf=chf(p.value,p.cur);return p;}).sort((a,b)=>b.chf-a.chf);}
const depVal=id=>positions(id).reduce((s,p)=>s+p.chf,0);
function depByCur(id){const r={};positions(id).forEach(p=>r[p.cur]=(r[p.cur]||0)+p.value);return r;}
function depDivByCur(id){const r={};positions(id).forEach(p=>{if(p.divYear)r[p.cur]=(r[p.cur]||0)+p.divYear;});return r;}
const depDivCHF=id=>positions(id).reduce((s,p)=>s+chf(p.divYear,p.cur),0);
const curList=o=>Object.keys(o).sort(curSort).map(c=>fmt(o[c],c)).join(' · ');
const isLiq=x=>x.liquid!==false;
const accInt=a=>bal(a.id)*(a.rate||0)/100;
/* Währungen in der Reihenfolge, wie sie in der eigenen Kontenliste zuerst vorkommen */
function curOrder(){const r=[];for(const a of D.accounts)if(!r.includes(a.cur))r.push(a.cur);return r;}
function overview(){
 const o={liq:0,ill:0,int:0,div:0};
 for(const a of D.accounts){const c=chf(bal(a.id),a.cur);if(isLiq(a))o.liq+=c;else o.ill+=c;o.int+=chf(accInt(a),a.cur);}
 for(const d of D.depots){const v=depVal(d.id);if(isLiq(d))o.liq+=v;else o.ill+=v;o.div+=depDivCHF(d.id);}
 return o;}
function bilanz(){
 const A=[],P=[];
 for(const a of D.accounts){const b=bal(a.id),c=chf(b,a.cur),key='a:'+a.id;if(b>1e-9)A.push({key,name:a.name,orig:b,cur:a.cur,chf:c,liq:isLiq(a)});else if(b<-1e-9)P.push({key,name:a.name,orig:-b,cur:a.cur,chf:-c});}
 for(const d of D.depots){const v=depVal(d.id);if(v>1e-9)A.push({key:'d:'+d.id,name:d.name,sub:'Wertschriften-Depot',orig:v,cur:'CHF',chf:v,dep:true,liq:isLiq(d)});}
 const ord=D.bilOrder||[],ix=k=>{const i=ord.indexOf(k);return i<0?1e9:i;};
 const srt=(x,y)=>ix(x.key)-ix(y.key)||y.chf-x.chf;
 A.sort(srt);P.sort(srt);
 const tA=A.reduce((s,x)=>s+x.chf,0),tP=P.reduce((s,x)=>s+x.chf,0);
 return{A,P,tA,tP,net:tA-tP};}
function saveBilOrder(part,ids){
 const B=bilanz();let A=B.A.map(x=>x.key),P=B.P.map(x=>x.key);
 if(part==='A')A=ids;else P=ids;
 const rest=(D.bilOrder||[]).filter(k=>!A.includes(k)&&!P.includes(k));
 D.bilOrder=[...A,...P,...rest];save();}
/* Grafiken Bilanz */
function assetGroups(B){
 const g={};
 for(const x of B.A){const k=x.dep?x.name+' (Depot)':GRPNAME[x.cur];g[k]=(g[k]||0)+x.chf;}
 return Object.entries(g).map(([label,val])=>({label,val}));}
const capGroups=B=>[{label:'Fremdkapital',val:B.tP},{label:'Eigenkapital',val:Math.max(B.net,0)}];
function liqGroups(B){let l=0,n=0;for(const x of B.A){if(x.liq)l+=x.chf;else n+=x.chf;}return[{label:'Liquide',val:l},{label:'Nicht liquide',val:n}];}
const budYear=b=>chf(b.amt*b.rhy,b.cur);
function budIst(b){const y=String(new Date().getFullYear());let s=0;for(const t of D.tx)if(t.type==='b'&&t.bud===b.id&&(t.date||'').startsWith(y)){const a=acc(t.acc);if(a)s+=chf(t.amt,a.cur);}return b.kind==='out'?-s:s;}
const missingRates=()=>CUR.filter(c=>c!=='CHF'&&!rate(c)&&(D.accounts.some(a=>a.cur===c)||D.budgets.some(b=>b.cur===c)||D.tx.some(t=>t.type==='w'&&t.cur===c)));

/* ===== Reihenfolge per Drag & Drop ===== */
function reorder(arr,ids){
 const set=new Set(ids),idx=[];arr.forEach((x,i)=>{if(set.has(x.id))idx.push(i);});
 const map={};arr.forEach(x=>map[x.id]=x);idx.forEach((i,k)=>arr[i]=map[ids[k]]);}
const byArr=arr=>ids=>{reorder(arr,ids);save();};
function enableSort(box,done){
 if(!box)return;
 box.querySelectorAll(':scope > .row[data-id] .grip').forEach(g=>{
  g.addEventListener('click',e=>e.stopPropagation());
  g.addEventListener('pointerdown',e=>{
   if(e.button>0)return;e.preventDefault();e.stopPropagation();
   const row=g.closest('.row'),before=[...box.children].map(r=>r.dataset.id).join();
   row.classList.add('drag');document.body.classList.add('dragging');
   let lastY=e.clientY,scr=null;
   const place=y=>{
    for(const r of box.querySelectorAll(':scope > .row[data-id]')){
     if(r===row)continue;const b=r.getBoundingClientRect();
     if(y>=b.top&&y<=b.bottom){if(y<b.top+b.height/2){if(r.previousElementSibling!==row)box.insertBefore(row,r);}else if(r.nextElementSibling!==row)box.insertBefore(row,r.nextSibling);break;}}};
   const auto=()=>{const h=innerHeight;const d=lastY<90?-12:lastY>h-130?12:0;if(d){scrollBy(0,d);place(lastY);}scr=requestAnimationFrame(auto);};
   scr=requestAnimationFrame(auto);
   const mv=ev=>{lastY=ev.clientY;place(ev.clientY);};
   const up=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);removeEventListener('pointercancel',up);
    cancelAnimationFrame(scr);row.classList.remove('drag');document.body.classList.remove('dragging');
    const ids=[...box.querySelectorAll(':scope > .row[data-id]')].map(r=>r.dataset.id);
    if(ids.join()!==before)done(ids);};
   addEventListener('pointermove',mv);addEventListener('pointerup',up);addEventListener('pointercancel',up);
  });
 });}

/* ===== Kurse aus dem Internet ===== */
async function getJSON(u){const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error(r.status);return r.json();}
async function refreshRates(show){
 const q={...Q.q};const ok=[];let paxg=null;
 try{let j;try{j=await getJSON('https://api.frankfurter.dev/v1/latest?base=CHF&symbols=USD,JPY');}catch(e){j=await getJSON('https://api.frankfurter.app/latest?from=CHF&to=USD,JPY');}
  if(j.rates.USD&&j.rates.JPY){q.USD=1/j.rates.USD;q.JPY=1/j.rates.JPY;ok.push('USD','JPY');}}catch(e){}
 try{const j=await getJSON('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,pax-gold&vs_currencies=usd');
  if(j.bitcoin&&j.bitcoin.usd){q.BTC=j.bitcoin.usd;ok.push('BTC');}if(j['pax-gold'])paxg=j['pax-gold'].usd;}catch(e){}
 try{const j=await getJSON('https://api.gold-api.com/price/XAU');if(j.price){q.AU=j.price;ok.push('AU');}}catch(e){}
 if(!ok.includes('AU')&&paxg){q.AU=paxg;ok.push('AU');}
 if(!ok.includes('BTC')){try{const j=await getJSON('https://api.gold-api.com/price/BTC');if(j.price){q.BTC=j.price;ok.push('BTC');}}catch(e){}}
 if(ok.length){Q={q,ts:new Date().toISOString()};saveQ();}
 if(show)toast(ok.length===4?'Kurse aktualisiert':ok.length?'Teilweise aktualisiert: '+ok.join(', '):'Keine Verbindung – Kurse unverändert');
 if(!document.body.classList.contains('dragging'))render();}
const ratesStand=()=>dts(Q.ts);
function rateText(c){const q=Q.q||{};
 if(c==='USD')return q.USD?'1 USD = CHF '+fmtN(q.USD,4):'–';
 if(c==='JPY')return q.JPY?'100 JPY = CHF '+fmtN(q.JPY*100,4):'–';
 if(c==='BTC')return q.BTC?'1 BTC = USD '+fmtN(q.BTC,0):'–';
 if(c==='AU')return q.AU?'1 Unze = USD '+fmtN(q.AU,2):'–';}

/* ===== Kuchendiagramm (App) ===== */
function pieItems(list,keep){list=list.filter(x=>x.val>0);if(!keep)list.sort((a,b)=>b.val-a.val);if(list.length>10){const r=list.slice(9);list=list.slice(0,9);list.push({label:'Übrige',val:r.reduce((s,x)=>s+x.val,0)});}return list;}
function pieHTML(list,showVal,keep){
 list=pieItems(list,keep);const tot=list.reduce((s,x)=>s+x.val,0);if(tot<=0)return'';
 let a=-Math.PI/2,p='';
 list.forEach((it,i)=>{const fr=it.val/tot,c=COL[i%COL.length];
  if(fr>0.9999){p+=`<circle cx="50" cy="50" r="48" fill="${c}"/>`;return;}
  const a2=a+fr*2*Math.PI,x1=50+48*Math.cos(a),y1=50+48*Math.sin(a),x2=50+48*Math.cos(a2),y2=50+48*Math.sin(a2);
  p+=`<path d="M50 50L${x1.toFixed(2)} ${y1.toFixed(2)}A48 48 0 ${fr>.5?1:0} 1 ${x2.toFixed(2)} ${y2.toFixed(2)}Z" fill="${c}"/>`;a=a2;});
 return `<div class="card pie"><svg viewBox="0 0 100 100">${p}<circle cx="50" cy="50" r="27" fill="#fff"/></svg><div class="leg">${list.map((it,i)=>`<div><i class="dot" style="background:${COL[i%COL.length]}"></i><span class="n">${esc(it.label)}</span>${showVal?`<span class="v">${fCHF(it.val).replace(/\.\d+$/,'')}</span>`:''}<b>${(it.val/tot*100).toFixed(1)}%</b></div>`).join('')}</div></div>`;}

function modal(html,mount,fixed){const ov=document.createElement('div');ov.className='ov';ov.innerHTML=`<div class="sheet">${html}</div>`;const close=()=>ov.remove();if(!fixed)ov.addEventListener('click',e=>{if(e.target===ov)close();});document.body.appendChild(ov);mount(ov.querySelector('.sheet'),close);}
const seg=(n,opts,v)=>`<div class="seg" data-n="${n}" data-v="${v}">${opts.map(([k,l])=>`<button type="button" data-k="${k}" class="${k===v?'on':''}">${l}</button>`).join('')}</div>`;
function segInit(root,cb){root.querySelectorAll('.seg').forEach(s=>{if(s.dataset.b)return;s.dataset.b=1;s.querySelectorAll('button').forEach(b=>b.onclick=()=>{segSet(s,b.dataset.k);cb&&cb(s.dataset.n,b.dataset.k);});});}
function segSet(s,k){s.dataset.v=k;s.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.k===k));}
const segVal=(root,n)=>root.querySelector(`.seg[data-n="${n}"]`).dataset.v;
const accOpts=sel=>D.accounts.map(a=>`<option value="${a.id}" ${a.id===sel?'selected':''}>${esc(a.name)} (${a.cur})</option>`).join('');
const curOpts=sel=>CUR.map(c=>`<option value="${c}" ${c===sel?'selected':''}>${c} – ${CURNAME[c]}</option>`).join('');
function budOpts(sel){const g=(k,l)=>{const b=D.budgets.filter(x=>x.kind===k);return b.length?`<optgroup label="${l}">${b.map(x=>`<option value="${x.id}" ${x.id===sel?'selected':''}>${esc(x.name)}</option>`).join('')}</optgroup>`:'';};return `<option value="">– wählen –</option>`+g('out','Ausgaben')+g('in','Einnahmen');}
const btns=(del,okText='Speichern')=>`<div class="err"></div><div class="btns"><button class="btn" id="ok">${okText}</button><button class="btn s2" id="cx">Abbrechen</button>${del?'<button class="btn del" id="dl">Löschen</button>':''}</div>`;
const liqSeg=x=>`<label>Verfügbarkeit</label>${seg('lq',[['1','Liquide'],['0','Nicht liquide']],isLiq(x)?'1':'0')}`;

function accForm(a){
 const e=!!a;a=a||{name:'',cur:'CHF',open:0};const has=e&&txOf(a.id).length>0;
 modal(`<h2>${e?'Konto bearbeiten':'Neues Konto'}</h2>
 <label>Name</label><input id="n" value="${esc(a.name)}" placeholder="z. B. Privatkonto">
 <label>Währung</label><select id="c" ${has?'disabled':''}>${curOpts(a.cur)}</select>${has?'<div class="hint">Währung ist fix, da bereits Buchungen bestehen.</div>':''}
 <label>Anfangssaldo</label>${seg('sg',[['+','Guthaben'],['-','Schuld']],(a.open||0)<0?'-':'+')}
 <input id="o" inputmode="decimal" style="margin-top:8px" value="${a.open?Math.abs(a.open):''}" placeholder="0">
 <label>Zinssatz % pro Jahr</label><input id="z" inputmode="decimal" value="${a.rate||''}" placeholder="optional, z. B. 1.25">
 <div class="hint">Bei einer Schuld ist der Zins ein Aufwand und wird negativ gerechnet.</div>
 ${liqSeg(a)}${btns(e)}`,(sh,close)=>{
  const q=s=>sh.querySelector(s);segInit(sh);q('#cx').onclick=close;if(!e)q('#n').focus();
  q('#ok').onclick=()=>{const n=q('#n').value.trim(),o=q('#o').value.trim()?num(q('#o').value):0,zs=q('#z').value.trim(),z=zs?num(zs):0;
   if(!n)return q('.err').textContent='Bitte einen Namen eingeben.';if(isNaN(o))return q('.err').textContent='Anfangssaldo ungültig.';if(isNaN(z))return q('.err').textContent='Zinssatz ungültig.';

/* ===== Verschlüsselung ===== */
const b64e=buf=>{const u=new Uint8Array(buf);let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s);};
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function deriveKey(pass,salt){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
 return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64d(salt),iterations:250000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['encrypt','decrypt']);}
const keyFromS=()=>crypto.subtle.importKey('raw',b64d(S.key),'AES-GCM',false,['encrypt','decrypt']);
async function enc(data,key,salt,updated){const iv=crypto.getRandomValues(new Uint8Array(12));
 const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(data)));
 return JSON.stringify({app:'haushaltbuch',v:1,updated,salt,iv:b64e(iv),ct:b64e(ct)});}
async function dec(obj,key){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(obj.iv)},key,b64d(obj.ct));return JSON.parse(new TextDecoder().decode(pt));}

/* ===== Synchronisation über geheimen GitHub-Gist ===== */
let S=lsGet(SK)||{};let rev=0,busy=false,timer=null,conflictOpen=false,errShown=false,lastPull=0;
const saveS=()=>localStorage.setItem(SK,JSON.stringify(S));
async function gh(path,opt={},token=S.token){
 let r;try{r=await fetch('https://api.github.com'+path,{...opt,cache:'no-store',headers:{Authorization:'Bearer '+token,Accept:'application/vnd.github+json',...(opt.body?{'Content-Type':'application/json'}:{})}});}
 catch(e){throw new Error('Keine Internetverbindung');}
 if(r.status===401)throw new Error('Token ungültig oder abgelaufen');if(r.status===403)throw new Error('Token hat keine Gist-Berechtigung');if(r.status===404)throw new Error('Gist nicht gefunden');
 if(!r.ok)throw new Error('GitHub-Fehler '+r.status);return r.json();}
async function gistContent(g){const f=g.files&&g.files[FN];if(!f)throw new Error('Datei fehlt im Gist');
 const c=f.truncated?await(await fetch(f.raw_url,{cache:'no-store'})).text():f.content;return JSON.parse(c);}
function schedulePush(){clearTimeout(timer);timer=setTimeout(sync,1500);}
async function sync(){
 if(!S.gistId||conflictOpen)return;if(busy){schedulePush();return;}
 busy=true;syncBadge('…');const r0=rev;
 try{
  const R=await gistContent(await gh('/gists/'+S.gistId));const key=await keyFromS();
  if(R.updated!==S.base){
   if(S.dirty){busy=false;syncBadge();return conflict(R,key);}
   let d;try{d=await dec(R,key);}catch(e){throw new Error('Entschlüsselung fehlgeschlagen – Passwort geändert? Neu einrichten.');}
   D=Object.assign(blank(),d);localStorage.setItem(KEY,JSON.stringify(D));S.base=R.updated;if(!document.body.classList.contains('dragging'))render();
  }else if(S.dirty){
   const up=Date.now();
   await gh('/gists/'+S.gistId,{method:'PATCH',body:JSON.stringify({files:{[FN]:{content:await enc(D,key,R.salt,up)}}})});
   S.base=up;if(rev===r0)S.dirty=false;else schedulePush();
  }
  S.last=Date.now();S.err='';errShown=false;
 }catch(e){S.err=e.message;if(!errShown){toast('Synchronisation: '+e.message);errShown=true;}}
 saveS();busy=false;lastPull=Date.now();syncBadge();if(V.v==='mehr')render();}
function conflict(R,key){
 conflictOpen=true;
 modal(`<h2>Daten auf zwei Geräten geändert</h2><p>Auf einem anderen Gerät wurde gespeichert (${dts(R.updated)}), während hier ebenfalls Änderungen offen sind. Welche Version soll gelten?</p>

function budgetPDF(){
 const p=new PDF(),inc=D.budgets.filter(b=>b.kind==='in'),out=D.budgets.filter(b=>b.kind==='out');
 if(!D.budgets.length)return toast('Noch keine Budget-Positionen.');
 p.head('Budget',`Stand ${dch(today())}  ·  Umrechnung in CHF zu Kursen vom ${ratesStand()}`,kursLine());
 const cols=[[395,'Betrag'],[470,'CHF / Monat'],[545,'CHF / Jahr']];
 const line=b=>{const a=acc(b.acc),nl=b.note?wrap(b.note,470,8):[];
  const cells=[{x:56,s:fit(b.name,140,9.5)},{x:200,s:fit((RHY[b.rhy])+(a?' · '+a.name:''),130,8.5),color:'#6c6f7f'},{x:395,s:fmt(b.amt,b.cur),al:'r',color:'#6c6f7f'},{x:470,s:fCHF(budYear(b)/12),al:'r'},{x:545,s:fCHF(budYear(b)),al:'r'}];
  if(!nl.length)return p.row(cells);
  p.need(16+nl.length*10);p.row(cells,{noLine:true});
  let yy=p.y+4;for(const ln of nl){p.t(56,yy,ln,{size:8,color:'#6c6f7f'});yy-=10;}
  const ly=yy+5;p.l(50,ly,545,ly,'#e2e2de',.5);p.y=ly-11;};
 const sum=L=>L.reduce((s,b)=>s+budYear(b),0),ti=sum(inc),to=sum(out);
 const tot=(l,v)=>{p.row([{x:56,s:l},{x:470,s:fCHF(v/12),al:'r'},{x:545,s:fCHF(v),al:'r'}],{bold:true,line:'#1d1d1f',lw:.8});p.y-=12;};
 p.section('Einnahmen',cols);inc.forEach(line);tot('Total Einnahmen',ti);
 p.section('Ausgaben',cols);out.forEach(line);tot('Total Ausgaben',to);
 p.need(30);p.row([{x:56,s:ti-to>=0?'Überschuss':'Fehlbetrag'},{x:470,s:fCHF((ti-to)/12),al:'r',color:ti-to<0?'#b3392f':'#2e7d4f'},{x:545,s:fCHF(ti-to),al:'r',color:ti-to<0?'#b3392f':'#2e7d4f'}],{bold:true,size:10.5,line:'#ffffff'});
 p.y-=20;p.pie('Anteile Budget-Positionen (Ausgaben)',out.map(b=>({label:b.name,val:budYear(b)})));
 download(p.out(),'Budget_'+today()+'.pdf');}
